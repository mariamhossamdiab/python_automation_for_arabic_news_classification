<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NewsGuard | AI News Classifier</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .loader { border-top-color: #3b82f6; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* Modal Animation */
        .modal-active { display: flex !important; animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="min-h-screen py-12 px-4">

    <div id="dashboardModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/80 p-4 backdrop-blur-sm">
        <div class="relative w-full max-w-6xl bg-white rounded-3xl shadow-2xl overflow-hidden">
            <div class="p-4 border-b flex justify-between items-center bg-slate-50">
                <h2 class="text-xl font-bold text-slate-800"><i class="fas fa-chart-pie mr-2 text-blue-600"></i>Classification Insights</h2>
                <button onclick="toggleModal()" class="text-slate-500 hover:text-red-500 transition-colors">
                    <i class="fas fa-times-circle text-2xl"></i>
                </button>
            </div>
            <div class="aspect-video w-full">
              
                <iframe title="news_classification_dashboard" class="w-full h-full" 
                    src="https://app.powerbi.com/view?r=eyJrIjoiM2NkNDc0MGUtNDkzZS00Nzg3LThiZjMtMTVjOGYwYjlmZmZmIiwidCI6IjI1Y2UwMjYxLWJiZDYtNDljZC1hMWUyLTU0MjYwODg2ZDE1OSJ9" 
                    frameborder="0" allowFullScreen="true"></iframe>
            </div>
        </div>
    </div>

    <div class="max-w-4xl mx-auto">
        <div class="flex flex-col md:flex-row justify-between items-center mb-10 gap-4">
            <div class="text-center md:text-left">
                <h1 class="text-4xl font-extrabold text-slate-900 mb-2">
                    <i class="fas fa-shield-check text-blue-600 mr-2"></i>NewsGuard AI
                </h1>
                <p class="text-slate-600">Analyze news authenticity and topics using machine learning.</p>
            </div>
            <button onclick="toggleModal()" class="flex items-center space-x-2 bg-white border border-slate-200 text-slate-700 px-6 py-3 rounded-xl hover:bg-slate-50 transition-all shadow-sm font-semibold">
                <i class="fas fa-chart-line text-blue-600"></i>
                <span>View Dashboard</span>
            </button>
        </div>

        <div class="grid grid-cols-1 gap-8">
            <div class="glass p-8 rounded-2xl shadow-xl border border-slate-200">
                <label class="block text-sm font-semibold text-slate-700 mb-2 uppercase tracking-wider">Paste News Content</label>
                <textarea id="newsInput" rows="6" 
                    class="w-full p-4 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all text-slate-800"
                    placeholder="Enter the news text here..."></textarea>
                
                <button onclick="classifyNews()" id="submitBtn"
                    class="w-full mt-4 bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl transition-all flex items-center justify-center space-x-2 shadow-lg active:scale-[0.98]">
                    <span>Analyze Content</span>
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>

            <div id="loading" class="hidden flex flex-col items-center py-10">
                <div class="loader ease-linear rounded-full border-4 border-t-4 border-slate-200 h-12 w-12 mb-4"></div>
                <p class="text-slate-500 animate-pulse">Our AI is analyzing the data...</p>
            </div>

            <div id="results" class="hidden space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="bg-white p-6 rounded-xl shadow-md border-b-4 border-blue-500 text-center">
                        <p class="text-xs font-bold text-slate-400 uppercase">Topic</p>
                        <h3 id="resTopic" class="text-2xl font-bold text-slate-800">-</h3>
                    </div>
                    <div id="verdictCard" class="bg-white p-6 rounded-xl shadow-md border-b-4 text-center transition-all">
                        <p class="text-xs font-bold text-slate-400 uppercase">Verdict</p>
                        <h3 id="resVerdict" class="text-2xl font-bold">-</h3>
                    </div>
                    <div class="bg-white p-6 rounded-xl shadow-md border-b-4 border-purple-500 text-center">
                        <p class="text-xs font-bold text-slate-400 uppercase">Confidence</p>
                        <h3 id="resScore" class="text-2xl font-bold text-slate-800">-</h3>
                    </div>
                </div>

                <div class="bg-white p-8 rounded-2xl shadow-md border border-slate-100">
                    <h4 class="text-lg font-bold text-slate-800 mb-4 border-b pb-2">Analysis Reason</h4>
                    <p id="resReason" class="text-slate-600 leading-relaxed italic">-</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ✅ Configuration
        const API_BASE_URL = 'http://127.0.0.1:8000';

        // Modal Toggle Logic
        function toggleModal() {
            const modal = document.getElementById('dashboardModal');
            modal.classList.toggle('hidden');
            modal.classList.toggle('modal-active');
        }

        async function classifyNews() {
            const newsText = document.getElementById('newsInput').value;
            const submitBtn = document.getElementById('submitBtn');
            const loading = document.getElementById('loading');
            const results = document.getElementById('results');
            const verdictCard = document.getElementById('verdictCard');

            if (!newsText.trim()) {
                alert("⚠️ Please enter some text to analyze.");
                return;
            }

            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-50');
            loading.classList.remove('hidden');
            results.classList.add('hidden');

            try {
                console.log('Sending request to:', `${API_BASE_URL}/classify`);
                
                const response = await fetch(`${API_BASE_URL}/classify`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ news: newsText })
                });

                console.log('Response status:', response.status);

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`HTTP ${response.status}: ${errorText}`);
                }
                
                const data = await response.json();
                console.log('Response data:', data);

                // ✅ Safely access nested properties
                document.getElementById('resTopic').innerText = data.topic || "Unknown";
                document.getElementById('resVerdict').innerText = data.classification || "UNKNOWN";
                document.getElementById('resScore').innerText = data.confidence_score || "N/A";
                document.getElementById('resReason').innerText = 
                    data.detailed_scores?.flag_reason || "No detailed reason provided.";

                // ✅ Update verdict card styling
                if (data.classification === "FAKE") {
                    verdictCard.style.borderColor = "#ef4444";
                    document.getElementById('resVerdict').style.color = "#ef4444";
                } else if (data.classification === "REAL") {
                    verdictCard.style.borderColor = "#10b981";
                    document.getElementById('resVerdict').style.color = "#10b981";
                } else {
                    verdictCard.style.borderColor = "#6b7280";
                    document.getElementById('resVerdict').style.color = "#6b7280";
                }

                results.classList.remove('hidden');
                results.scrollIntoView({ behavior: 'smooth' });

            } catch (error) {
                console.error("❌ Error:", error);
                alert(`❌ Connection failed!\n\nError: ${error.message}\n\nMake sure:\n1. Backend is running: uvicorn main:app --reload\n2. Backend is accessible at ${API_BASE_URL}`);
            } finally {
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-50');
                loading.classList.add('hidden');
            }
        }

        // ✅ Test backend connection on page load
        window.addEventListener('load', async () => {
            try {
                const response = await fetch(`${API_BASE_URL}/`);
                const data = await response.json();
                console.log('✅ Backend connected:', data);
            } catch (error) {
                console.warn('⚠️ Backend not reachable:', error.message);
            }
        });
    </script>
</body>
</html>
